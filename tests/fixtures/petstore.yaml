openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A small pet store API used as a test fixture.
servers:
  - url: http://localhost:8080/v1
security:
  - apiKey: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags: [pets]
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A page of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPet
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "422":
          $ref: "#/components/responses/Error"
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: showPetById
      summary: Get one pet
      tags: [pets]
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags: [pets]
      deprecated: true
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        tag:
          type: string
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
